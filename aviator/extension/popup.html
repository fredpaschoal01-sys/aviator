<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aviator Analyzer AI</title>

<link rel="stylesheet" href="popup.css">

</head>

<body>

<div class="container">

    <h1>Aviator Analyzer AI</h1>

    <p class="subtitulo">
        Leitor Inteligente do Aviator
    </p>

    <div class="card">

        <span class="titulo">
            Status
        </span>

        <span
            id="status"
            class="valor">
            Conectando...
        </span>

    </div>

    <div class="card">

        <span class="titulo">
            Rodadas capturadas
        </span>

        <span
            id="total"
            class="valor">
            0
        </span>

    </div>

    <div class="card">

        <span class="titulo">
            Último Multiplicador
        </span>

        <span
            id="ultimo"
            class="valor">
            --
        </span>

    </div>

    <div class="card">

        <span class="titulo">
            Última atualização
        </span>

        <span
            id="hora"
            class="valor">
            --
        </span>

    </div>

    <button id="abrirDashboard">

        Abrir Dashboard

    </button>

</div>

<script src="popup.js"></script>

</body>

</html>
